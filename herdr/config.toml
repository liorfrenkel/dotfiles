onboarding = false

[ui.toast]
delivery = "off"

[ui]
status_indicators = "symbols"

[keys]
prefix = "ctrl+b"
clear_pane = "prefix+ctrl+k"
previous_workspace = ["prefix+,", "ctrl+alt+k"]
next_workspace = ["prefix+.", "ctrl+alt+j"]
previous_agent = ["prefix+;", "ctrl+alt+p"]
next_agent = ["prefix+'", "ctrl+alt+n"]
cycle_pane_next = ["prefix+tab", "ctrl+alt+l"]
cycle_pane_previous = ["prefix+shift+tab", "ctrl+alt+h"]

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+e"
type = "pane"
command = "nvim"
description = "neovim"

[[keys.command]]
key = "prefix+alt+w"
type = "pane"
command = "wt switch -x nvim -- -c 'DiffviewOpen main...HEAD'"
description = "wt switch + diffview vs main"

[[keys.command]]
key = "prefix+space"
type = "shell"
command = "~/.config/herdr/auto-split.sh"
description = "auto split"
